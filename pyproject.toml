[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "Sistema de trading institucional multiagente para XAUUSD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ml = ["scikit-learn>=1.3", "xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conjunto de reglas explícito (independiente de la versión de ruff): réplica del
# default histórico (E4/E7/E9 + F). No se activa import-sorting (I) ni otras
# familias. Se ignora E702: el estilo compacto `a = x; b = y` es deliberado aquí.
select = ["E4", "E7", "E9", "F"]
ignore = ["E702"]
