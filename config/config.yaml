# Configuración del sistema de trading multiagente (XAUUSD)
symbol: XAUUSD

# Gestión de riesgo (ver risk/risk_manager.py::RiskParameters)
risk:
  account_balance: 10000.0
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 5.0
  contract_size: 100.0
  min_lot: 0.01
  max_lot: 50.0
  lot_step: 0.01

# Conexión MetaTrader 5 (Fase 3). Credenciales por variables de entorno
# (MT5_LOGIN/MT5_PASSWORD/MT5_SERVER); NO poner secretos aquí.
mt5:
  enabled: false          # true para operar en vivo con RealMT5Client
  path: null              # ruta al terminal64.exe (opcional)
  magic: 20250725
  filling: IOC            # IOC | FOK
  bars: 500               # nº de velas por timeframe a solicitar

# Guardián de mercado (condiciones de ejecución en vivo)
guards:
  max_spread: 0.60        # spread máximo aceptable en precio (USD); null = sin límite
  allow_weekend: false
  trading_hours:          # ventanas UTC permitidas [inicio, fin); vacío = sin límite
    - [7, 16]             # Londres + solape de Nueva York

# Operativa en vivo
live:
  max_positions: 1
  be_trigger: 1.0         # ATR de beneficio para mover a break-even
  trail_trigger: 2.0      # ATR de beneficio para activar trailing

# Supervisor central
supervisor:
  weighting: adaptive        # static | adaptive | meta
  base_weight: 1.0
  learning_rate: 0.1
  meta_warmup: 30            # muestras por régimen antes de que el meta-modelo pese
  buy_threshold: 0.15        # zona muerta del score para pasar a BUY/SELL
  conflict_threshold: 0.5    # acuerdo mínimo del conjunto; por debajo => WAIT
  # Pesos usados solo en modo 'static':
  weights:
    trend_mtf: 1.5
    technical: 1.2
    market_structure: 1.4

# Agentes activos. Cada bloque se pasa como `config` al agente.
agents:
  trend_mtf:
    ema_fast: 20
    ema_slow: 50
  momentum:
    roc_period: 10
    threshold_pct: 0.15
  technical: {}
  volatility: {}
  volume: {}
  market_structure: {}
  support_resistance: {}
  candlestick: {}
  session: {}
  risk_management:
    max_atr_pct: 2.5
    sl_mult: 1.5
    tp_mult: 2.5
  open_trades_control: {}

  # --- Fase 2: Smart Money / Price Action (implementados) ---
  smart_money:
    lookback: 50
  order_blocks:
    impulse_atr: 1.0
  fair_value_gap:
    min_atr_frac: 0.25
  liquidity_sweep: {}
  wyckoff:
    lookback: 30
  harmonic: {}

  # --- Fase 4: Machine Learning (implementado) ---
  machine_learning:
    model: logistic         # logistic (numpy) | gboosting (sklearn) | xgboost
    horizon: 5              # barras a futuro para la etiqueta
    margin: 0.10            # umbral de probabilidad sobre 0.5 para señalar
    retrain_every: 50       # reentrenamiento periódico (ventana expansiva)
    min_train: 150

  # --- Agentes planificados (scaffold: devuelven WAIT hasta su fase) ---
  elliott: { enabled: false }
  correlation: { enabled: false }
  news: { enabled: false }
