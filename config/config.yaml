# Configuración del sistema de trading multiagente (XAUUSD)
symbol: XAUUSD

# Gestión de riesgo (ver risk/risk_manager.py::RiskParameters)
risk:
  account_balance: 10000.0
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 5.0
  contract_size: 100.0
  min_lot: 0.01
  max_lot: 50.0
  lot_step: 0.01

# Conexión MetaTrader 5 (Fase 3). Credenciales por variables de entorno
# (MT5_LOGIN/MT5_PASSWORD/MT5_SERVER); NO poner secretos aquí.
mt5:
  enabled: false          # true para operar en vivo con RealMT5Client
  path: null              # ruta al terminal64.exe (opcional)
  magic: 20250725
  filling: IOC            # IOC | FOK
  bars: 500               # nº de velas por timeframe a solicitar
  closed_bars_only: true  # analizar solo velas CERRADAS (descarta la vela en formación)
  # Timeframe de análisis en vivo (el más fino = timeframe de decisión). M30
  # coincide con el backtest validado; el runner sigue revisando cada `interval`.
  timeframes: [M30, H1, H4]

# Persistencia (Fase 6). backend sqlite (local/tests) o mysql (producción,
# mismas tablas que lee el dashboard PHP). Credenciales MySQL por variables
# de entorno DB_* (ver .env.example).
persistence:
  enabled: false
  backend: sqlite         # sqlite | mysql
  sqlite_path: data/trading.db

# Costes de transacción (backtesting): descontados por operación (round-turn).
costs:
  spread: 0.30            # spread del Oro en precio (USD); se paga entero por operación
  slippage: 0.02          # deslizamiento por lado (USD)
  commission_per_lot: 0.0 # comisión round-turn por lote (cuenta ECN)

# Guardián de mercado (condiciones de ejecución en vivo)
guards:
  max_spread: 0.60        # spread máximo aceptable en precio (USD); null = sin límite
  allow_weekend: false
  trading_hours:          # ventanas UTC permitidas [inicio, fin); vacío = sin límite
    - [7, 16]             # Londres + solape de Nueva York

# Operativa en vivo
live:
  max_positions: 1
  be_trigger: 1.0         # ATR de beneficio para mover a break-even
  trail_trigger: 2.0      # ATR de beneficio para activar trailing
  cards_path: logs/decisiones.log  # ficha de decisión por operación (null = solo log)

# Kill switch / watchdog (Fase 7): corta nuevas entradas ante riesgo.
kill_switch:
  enabled: true
  max_daily_loss: 500.0          # pérdida diaria máxima (dinero); null = sin límite
  max_drawdown: 800.0            # drawdown máximo de equity realizada; null = sin límite
  max_consecutive_losses: 5      # rachas de pérdidas; null = sin límite
  flag_file: null                # ruta a un fichero cuya existencia detiene la operativa

# Alertas (Fase 7): canales de notificación. Credenciales por variables de entorno.
alerts:
  enabled: false
  channels: [logging]            # logging | telegram | email (combinables)
  # telegram: token/chat_id por TELEGRAM_TOKEN / TELEGRAM_CHAT_ID
  # email:    por SMTP_HOST/PORT/USER/PASSWORD y ALERT_TO

# Supervisor central
supervisor:
  weighting: meta            # static | adaptive | meta (meta gana en backtest 4.7a)
  base_weight: 1.0
  learning_rate: 0.1
  meta_warmup: 30            # muestras por régimen antes de que el meta-modelo pese
  buy_threshold: 0.15        # zona muerta del score para pasar a BUY/SELL
  conflict_threshold: 0.5    # acuerdo mínimo del conjunto; por debajo => WAIT
  # Pesos usados solo en modo 'static':
  weights:
    trend_mtf: 1.5
    technical: 1.2
    market_structure: 1.4

# Agentes activos. Cada bloque se pasa como `config` al agente.
agents:
  trend_mtf:
    ema_fast: 20
    ema_slow: 50
  momentum:
    roc_period: 10
    threshold_pct: 0.15
  technical: { enabled: false }   # flojo (backtest 4.7a): quitarlo sube el PF
  volatility: {}
  volume: { enabled: false }      # flojo (backtest 4.7a): quitarlo sube el PF
  bollinger_stoch:                # reversión en rango: Bollinger + Estocástico
    enabled: false                # se valida con backtest antes de activarlo
    bb_period: 20
    bb_mult: 2.0
    k_period: 14
    d_period: 3
    max_adx: 25.0                 # solo opera reversión en rango (ADX bajo)
  supertrend_adx:                 # tendencia: SuperTrend (ATR) + filtro ADX
    enabled: false
    period: 10
    mult: 3.0
    min_adx: 20.0
  williams_r:                     # reversión Williams %R (primo del estocástico)
    enabled: false
    period: 14
    oversold: -80.0
    overbought: -20.0
  alligator:                      # Bill Williams Alligator (3 SMMA desplazadas)
    enabled: true                 # backtest 4.7a: +3.3% beneficio y mejor PF
  fibonacci:                      # retrocesos de Fib a favor de tendencia
    enabled: false
    tol_atr: 0.5                  # cercanía (× ATR) a la zona Fib para entrar
  market_structure:
    swing_length: 5        # estructura de largo plazo
    internal_length: 2     # estructura interna (corto plazo) para confluencia
  premium_discount:
    enabled: false         # DESACTIVADO: contrarian, resta en un activo tendencial
                           # (backtest 4.7a: -36% de beneficio). Reactivar con cuidado.
    lookback: 50
    discount: 0.25         # zona baja del rango (favorece compras)
    premium: 0.75          # zona alta del rango (favorece ventas)
  support_resistance: {}
  candlestick: { enabled: false }  # flojo (backtest 4.7a): quitarlo sube el PF
  session: {}
  risk_management:
    max_atr_pct: 2.5
    sl_mult: 1.0            # validado out-of-sample (SL ajustado + TP amplio)
    tp_mult: 2.5
  open_trades_control: {}

  # --- Fase 2: Smart Money / Price Action (implementados) ---
  smart_money:
    lookback: 50
  order_blocks:
    impulse_atr: 1.0
  fair_value_gap:
    min_atr_frac: 0.25
  liquidity_sweep: {}
  wyckoff:
    lookback: 30
  wyckoff_pro:                # Wyckoff con volumen (esfuerzo vs resultado)
    enabled: false            # se valida con backtest antes de activarlo
    lookback: 30
    low_vol: 1.0              # <= media = "sin oferta/demanda"
    high_vol: 1.5             # >= 1.5x media = ruptura confirmada (SOS/SOW)
  harmonic: {}

  # --- Fase 4: Machine Learning (implementado) ---
  machine_learning:
    model: logistic         # logistic (numpy) | gboosting (sklearn) | xgboost
    horizon: 5              # barras a futuro para la etiqueta
    margin: 0.10            # umbral de probabilidad sobre 0.5 para señalar
    retrain_every: 50       # reentrenamiento periódico
    min_train: 150
    max_train_window: 3000  # tope de la ventana de entrenamiento (rolling)

  # --- Fase 5: Contexto externo (implementados) ---
  # Requieren un proveedor de datos. El NewsAgent puede cargar un CSV
  # (calendar_csv); correlation/sentiment necesitan inyectar el objeto provider
  # en agent.config['provider'] tras construir el motor. Sin proveedor devuelven
  # WAIT de forma inocua.
  news:
    calendar_csv: config/calendar_econ.csv  # calendario USD (UTC). Actualízalo cada semana.
    blackout_before_min: 30
    blackout_after_min: 15
    currencies: [USD]
  correlation:
    lookback: 50
    min_abs_corr: 0.3
    threshold: 0.1
    timeframe: H1
    # Activos correlacionados con el Oro (deben existir en tu broker MT5).
    # AUDUSD ~ correlación positiva; USDCHF ~ inversa. El agente mide el signo solo.
    symbols: [USDCHF, AUDUSD]
  sentiment:
    extreme_long: 70
    extreme_short: 30
  # Flujo de noticias (TheNewsAPI, solo-live). Veta ante ráfagas de titulares.
  # Actívalo en el VPS con la variable de entorno NEWS_API_TOKEN.
  news_flow:
    enabled: false
    window_min: 60          # ventana para contar titulares recientes
    min_articles: 3         # nº de titulares que dispara la cautela/veto
    refresh_sec: 900        # cada cuánto consulta la API (respeta 100 req/día)

  # --- Elliott: impulso 1-5 + corrección ABC (entrada al reanudarse) ---
  elliott:
    tolerance: 0.05
